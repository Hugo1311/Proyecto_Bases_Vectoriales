services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bd2_pgvector
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: vectordb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: bd2_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bd2_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  chromadata:
  qdrantdata: